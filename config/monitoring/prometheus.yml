global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: production
    instance: fuelrod-monitoring

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090

  - job_name: grafana-alloy
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana-alloy:12345
        labels:
          service: monitoring

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:2019
        labels:
          service: caddy

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: loki

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis
