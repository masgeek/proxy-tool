<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Service temporarily unavailable</title>
	<style>
		:root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 20% 20%, #dcfce7 0, transparent 35%), radial-gradient(circle at 80% 80%, #ccfbf1 0, transparent 35%), #f0fdf4; color: #172033; }
		main { width: min(36rem, calc(100% - 3rem)); padding: 3rem; border: 1px solid #86efac; border-radius: 1rem; background: rgb(255 255 255 / 90%); box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%); text-align: center; animation: rise .6s ease-out both; }
		.illustration { display: block; width: 16rem; height: 10rem; margin: 0 auto 1rem; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 .75rem 1rem rgb(59 130 246 / 18%)); }
		.status { margin: 0; color: #15803d; font-size: 4rem; font-weight: 800; letter-spacing: -.05em; animation: pulse 2.5s ease-in-out infinite; }
		h1 { margin: .5rem 0; font-size: 1.5rem; } p { margin: 0; color: #667085; line-height: 1.6; } small { display: block; margin-top: 1.5rem; color: #667085; line-height: 1.6; }
		@keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-.6rem) rotate(1deg); } } @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .72; } } @keyframes rise { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
		@media (prefers-color-scheme: dark) { body { background: #111827; color: #f3f4f6; } main { border-color: #374151; background: #1f2937; box-shadow: none; } p { color: #9ca3af; } .status { color: #f97066; } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
	</style>
</head>
<body>
	<main>
		<svg class="illustration" viewBox="0 0 160 100" role="img" aria-label="A cheerful cloud taking a short break"><path fill="#bbf7d0" d="M35 76c-15 0-27-10-27-23s10-23 24-24c5-14 18-23 34-23 18 0 33 12 36 29 12 2 21 12 21 23 0 12-10 22-24 22H35z"/><path fill="#86efac" d="M45 71c-9 0-16-6-16-14 0-7 6-13 14-14 4-10 13-16 24-16 12 0 22 8 24 19 8 1 14 7 14 14 0 8-7 14-16 14H45z"/><circle cx="62" cy="53" r="3" fill="#1e3a8a"/><circle cx="88" cy="53" r="3" fill="#1e3a8a"/><path d="M69 61c4 4 10 4 14 0" fill="none" stroke="#1e3a8a" stroke-linecap="round" stroke-width="3"/><path d="M42 39 31 30M108 39l11-9" fill="none" stroke="#6ee7b7" stroke-linecap="round" stroke-width="4"/></svg>
		<p class="status">503</p><h1>Service temporarily unavailable</h1><p>The service is not responding right now. Please wait two minutes and try again.</p><small>If the problem continues, contact the service administrator and include the request ID from the <code>X-Request-ID</code> response header.</small>
	</main>
</body>
</html>
