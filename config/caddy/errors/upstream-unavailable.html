<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>503 — Service temporarily unavailable</title>
	<style>
		:root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 15% 20%, #93c5fd 0, transparent 40%), radial-gradient(circle at 85% 15%, #c4b5fd 0, transparent 40%), radial-gradient(circle at 50% 90%, #fbcfe8 0, transparent 45%), #eef2ff; color: #172033; }
		main { width: min(36rem, calc(100% - 3rem)); padding: 3rem; border: 1px solid rgb(255 255 255 / 60%); border-radius: 1.25rem; background: rgb(255 255 255 / 45%); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 1.5rem 3rem rgb(23 32 51 / 12%), inset 0 1px 0 rgb(255 255 255 / 60%); text-align: center; animation: rise .6s ease-out both; }
		.logo { display: block; height: 4rem; width: auto; margin: 0 auto 1.5rem; }
		.illustration { display: block; width: 13rem; height: 13rem; margin: 0 auto 1rem; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 .75rem 1.25rem rgb(30 58 138 / 30%)); }
		.status { margin: 0; color: #b42318; font-size: 4rem; font-weight: 800; letter-spacing: -.05em; animation: pulse 2.5s ease-in-out infinite; }
		h1 { margin: .5rem 0; font-size: 1.5rem; }
		p { margin: 0; color: #667085; line-height: 1.6; }
		.actions { margin-top: 1.5rem; display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; }
		.retry {
			appearance: none; border: 1px solid #93c5fd; border-radius: .5rem; background: #eff6ff; color: #1d4ed8;
			font: inherit; font-weight: 600; font-size: .875rem; padding: .5rem 1rem; cursor: pointer;
			transition: background-color .15s ease;
		}
		.retry:hover, .retry:focus-visible { background: #dbeafe; }
		.retry:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
		small { display: block; margin-top: 1.5rem; color: #667085; line-height: 1.6; }
		@keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-.6rem) rotate(1deg); } }
		@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
		@keyframes rise { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
		@media (prefers-color-scheme: dark) {
			body { background: radial-gradient(circle at 15% 20%, #1e3a8a 0, transparent 45%), radial-gradient(circle at 85% 15%, #4c1d95 0, transparent 45%), radial-gradient(circle at 50% 90%, #831843 0, transparent 50%), #0f172a; color: #f3f4f6; }
			main { border-color: rgb(255 255 255 / 12%); background: rgb(31 41 55 / 45%); box-shadow: 0 1.5rem 3rem rgb(0 0 0 / 35%), inset 0 1px 0 rgb(255 255 255 / 8%); }
			p { color: #9ca3af; }
			.status { color: #f97066; }
			.retry { background: #1e293b; border-color: #3b82f6; color: #93c5fd; }
			.retry:hover, .retry:focus-visible { background: #24344a; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
		}
	</style>
</head>
<body>
	<main>
		<img class="logo" src="https://munywele.sirv.com/munyweleco/logo_white.svg" alt="Munywele Consulting">
		<svg class="illustration" viewBox="0 0 200 200" role="img" aria-label="A rocket taking a pit stop in space among stars and a distant ringed planet, about to relaunch">
			<defs>
				<radialGradient id="space" cx="50%" cy="42%" r="75%">
					<stop offset="0%" stop-color="#1e3a8a"/>
					<stop offset="55%" stop-color="#172554"/>
					<stop offset="100%" stop-color="#0b1130"/>
				</radialGradient>
				<linearGradient id="rocketBody" x1="0" y1="0" x2="1" y2="0">
					<stop offset="0%" stop-color="#f8fafc"/>
					<stop offset="100%" stop-color="#cbd5e1"/>
				</linearGradient>
				<linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0%" stop-color="#fde68a"/>
					<stop offset="55%" stop-color="#fb923c"/>
					<stop offset="100%" stop-color="#ef4444"/>
				</linearGradient>
				<radialGradient id="planet" cx="35%" cy="35%" r="70%">
					<stop offset="0%" stop-color="#c4b5fd"/>
					<stop offset="100%" stop-color="#7c3aed"/>
				</radialGradient>
				<clipPath id="porthole"><rect x="4" y="4" width="192" height="192" rx="28"/></clipPath>
			</defs>

			<rect x="4" y="4" width="192" height="192" rx="28" fill="url(#space)"/>

			<g clip-path="url(#porthole)">
				<!-- stars -->
				<g fill="#e0e7ff">
					<circle cx="30" cy="34" r="1.6"/>
					<circle cx="52" cy="20" r="1.1"/>
					<circle cx="168" cy="30" r="1.6"/>
					<circle cx="150" cy="150" r="1.4"/>
					<circle cx="26" cy="150" r="1.3"/>
					<circle cx="170" cy="100" r="1.1"/>
					<circle cx="18" cy="100" r="1.4"/>
				</g>
				<path fill="#fde68a" d="M40 60l3 6.5 6.5 3-6.5 3-3 6.5-3-6.5-6.5-3 6.5-3z"/>
				<path fill="#fde68a" d="M158 130l2.4 5 5 2.4-5 2.4-2.4 5-2.4-5-5-2.4 5-2.4z"/>

				<!-- comet streak -->
				<path d="M150 24 L110 44" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>

				<!-- distant ringed planet -->
				<g transform="translate(148 62)">
					<ellipse cx="0" cy="0" rx="24" ry="8" fill="none" stroke="#ddd6fe" stroke-width="2.5" opacity=".85" transform="rotate(-18)"/>
					<circle r="14" fill="url(#planet)"/>
					<ellipse cx="0" cy="0" rx="24" ry="8" fill="none" stroke="#ddd6fe" stroke-width="2.5" transform="rotate(-18)"/>
				</g>

				<!-- ground / launch pad -->
				<rect x="4" y="168" width="192" height="28" fill="#0b1130"/>
				<rect x="55" y="164" width="90" height="8" rx="2" fill="#334155"/>
				<rect x="70" y="156" width="8" height="10" fill="#334155"/>
				<rect x="122" y="156" width="8" height="10" fill="#334155"/>

				<!-- flame -->
				<path fill="url(#flame)" d="M100 150c-8 10-8 20 0 28 8-8 8-18 0-28z"/>

				<!-- rocket -->
				<g transform="translate(100 96)">
					<path fill="url(#rocketBody)" d="M0-56c14 12 20 32 20 52 0 8-2 16-2 16h-36s-2-8-2-16c0-20 6-40 20-52z"/>
					<path fill="#ef4444" d="M-20 12l-16 22h16z"/>
					<path fill="#ef4444" d="M20 12l16 22h-16z"/>
					<circle cy="-14" r="9" fill="#38bdf8" stroke="#0369a1" stroke-width="2.5"/>
					<path fill="none" stroke="#94a3b8" stroke-width="2" d="M-18 6h36"/>
				</g>
			</g>

			<rect x="4" y="4" width="192" height="192" rx="28" fill="none" stroke="#1e293b" stroke-width="2" opacity=".4"/>
		</svg>
		<p class="status" role="status" aria-live="polite">503</p>
		<h1>Service temporarily unavailable</h1>
		<p>The service is not responding right now. Please wait a couple of minutes and try again.</p>
		<div class="actions">
			<button type="button" class="retry" id="retry">Retry now</button>
		</div>
		<small>Still seeing this after a few minutes? Get in touch with our support team and we'll take a look.</small>
	</main>
	<script>
		document.getElementById('retry').addEventListener('click', function () {
			location.reload();
		});
	</script>
</body>
</html>
