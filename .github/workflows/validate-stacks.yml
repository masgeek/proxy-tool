name: Validate Stacks

# Renders every Compose file and the host Caddy configuration, so a broken
# interpolation or a missing variable fails here instead of on a deploy.
#
# No Docker daemon is required: `docker compose config` only parses and
# interpolates, and the Caddy check runs in a container.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner versions
        run: |
          docker --version
          docker compose version

      # scripts/validate-compose.sh never reads real secrets: it uses a stack's
      # .env when one exists locally and .env.example otherwise, and injects
      # placeholders for any required variable the renderer still reports missing.
      - name: Validate all stacks
        run: scripts/validate-compose.sh

      - name: Validate a single stack from the changed paths
        if: always() && failure()
        run: |
          echo "Re-run one stack at a time to narrow it down:" >&2
          echo "  scripts/validate-compose.sh budget" >&2
          echo "  scripts/validate-compose.sh invoice baserow" >&2

  caddy:
    name: Caddy configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The imports in config/caddy/Caddyfile are relative to that directory, so
      # the whole directory is mounted and validated in place.
      - name: Validate the host Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/config/caddy:/etc/caddy:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate each standalone stack snippet
        run: |
          status=0
          for snippet in stacks/*/Caddyfile; do
            [ -e "$snippet" ] || continue
            echo "::group::$snippet"
            # Standalone snippets are fragments, so they are adapted rather than
            # validated as a complete configuration.
            if ! docker run --rm \
              -v "$PWD:/work:ro" \
              -w /work \
              caddy:2-alpine \
              sh -c "printf '%s\n' 'localhost:9999 {' > /tmp/merged.caddy && cat '$snippet' >> /tmp/merged.caddy && printf '%s\n' '}' >> /tmp/merged.caddy && caddy validate --config /tmp/merged.caddy --adapter caddyfile"; then
              echo "::error::$snippet failed to adapt"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
