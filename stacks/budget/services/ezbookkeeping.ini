# ezBookkeeping configuration
#
# Mirrors the structure of the shipped default configuration at
# https://github.com/mayswind/ezbookkeeping/blob/main/conf/ezbookkeeping.ini
# with the values this deployment needs.
#
# It is mounted read-only at /ezbookkeeping/conf/ezbookkeeping.ini and must
# exist: the image resolves the path from EBK_CONF_PATH and aborts at startup
# with `open : no such file or directory` when it is missing.
#
# Every value here can be overridden by an EBK_{SECTION}_{OPTION} environment
# variable, and this stack sets all operational values through
# stacks/budget/.env instead, so no secret lives in this file. Precedence is:
# value-from-file variable > direct environment variable > this file.
#
# Sections are kept complete on purpose. ezBookkeeping validates the ones it
# needs, and an omitted section has produced startup aborts such as
# `invalid server mode` (global.mode) and `invalid uuid mode`
# (uuid.generator_type).

[global]
# Either "production", "development"
mode = production

[server]
# Protocol (http, https, socket). Caddy terminates TLS, so the container speaks
# plain HTTP and the public scheme is only used for generated links.
protocol = http
http_addr = 0.0.0.0
http_port = 8080
domain = budget.munywele.co.ke
# Overridden by EBK_SERVER_ROOT_URL. The default template appends the container
# port, which would leak :8080 into every link behind Caddy.
root_url = https://budget.munywele.co.ke/
cert_file =
cert_key_file =
unix_socket =
static_root_path = public
# Caddy compresses where it decides to; compressing twice wastes CPU.
enable_gzip = false
log_request = true
request_id_header = true

[mcp]
# Leave off until the ingestion service exists.
enable_mcp = false
mcp_allowed_remote_ips =

[database]
# Either "mysql", "postgres" or "sqlite3". Overridden by EBK_DATABASE_TYPE.
type = postgres
# Overridden by EBK_DATABASE_* — host is "name:port".
host = postgres:5432
name = ezbookkeeping
user = ezbookkeeping
passwd =
# For "postgres" only: "disable", "require" or "verify-full"
ssl_mode = disable
db_path = data/ezbookkeeping.db
max_idle_conn = 2
max_open_conn = 0
conn_max_lifetime = 14400
log_query = false
auto_update_database = true

[mail]
# Needed for password reset and any mail delivery. Overridden by
# EBK_MAIL_* once the shared Mailpit or a real SMTP relay is configured.
enable_smtp = false
smtp_host = 127.0.0.1:25
smtp_user =
smtp_passwd =
smtp_skip_tls_verify = false
from_address =

[log]
# Either "console", "file", or both separated by a space.
# Console is what the monitoring stack collects; file keeps a local copy.
mode = console file
level = info
log_path = log/ezbookkeeping.log
request_log_path =
query_log_path =
log_file_rotate = false
log_file_max_size = 104857600
log_file_max_days = 7

[storage]
# Object storage type: "local_filesystem", "s3", "minio" or "webdav"
type = local_filesystem
local_filesystem_path = /ezbookkeeping/storage
s3_endpoint = 127.0.0.1:9000
s3_region = us-east-1
s3_access_key_id =
s3_secret_access_key =
s3_session_token =
s3_use_ssl = false
s3_skip_tls_verify = false
s3_use_path_style = false
s3_bucket = ezbookkeeping
s3_root_path = /
minio_endpoint = 127.0.0.1:9000
minio_location =
minio_access_key_id =
minio_secret_access_key =
minio_use_ssl = false
minio_skip_tls_verify = false
minio_bucket = ezbookkeeping
minio_root_path = /
webdav_url =
webdav_username =
webdav_password =
webdav_root_path = /
webdav_request_timeout = 10000
webdav_proxy = system
webdav_skip_tls_verify = false

