# ezBookkeeping configuration
#
# Mounted read-only at /ezbookkeeping/conf/ezbookkeeping.ini. Every value here can
# be overridden by an EBK_{SECTION}_{OPTION} environment variable, and this stack
# sets all the operational ones through stacks/budget/.env instead, so secrets
# never live in the repository.
#
# The file itself must exist: the image resolves its path from EBK_CONF_PATH and
# fails at startup with `open : no such file or directory` when it is missing.
#
# Option names below are from the upstream configuration reference. Note that
# `mode` belongs to the `global` section, not `server`, and that omitting it makes
# the app abort with `invalid server mode`. Storage options live in the `storage`
# section, and the listen port is `http_port`, not `port`.

[global]
mode = production

[server]
# Overridden by EBK_SERVER_DOMAIN, EBK_SERVER_PROTOCOL and EBK_SERVER_ROOT_URL.
protocol = https
domain = budget.munywele.co.ke
http_port = 8080
# Caddy terminates TLS and compresses where it decides to, so the app does not.
enable_gzip = false

[uuid]
# Without an explicit generator the app aborts at startup with
# "invalid uuid mode". server_id must be 0-255 and unique per instance.
generator_type = internal
server_id = 0

[log]
# "file" writes to /ezbookkeeping/log, "console" to stdout where the monitoring
# stack collects it. Overridden by EBK_LOG_MODE.
mode = file
level = info

[database]
# Overridden by EBK_DATABASE_* — this stack uses PostgreSQL, not sqlite3.
type = sqlite3

[storage]
type = local_filesystem
local_filesystem_path = /ezbookkeeping/storage

[security]
# Overridden by EBK_SECURITY_SECRET_KEY. Generate with:
#   openssl rand -base64 32
# Never commit a real value.
secret_key = change_me
