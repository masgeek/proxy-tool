# ezBookkeeping configuration
#
# Mounted read-only at /ezbookkeeping/conf/ezbookkeeping.ini. Every value here can
# be overridden by an EBK_{SECTION}_{OPTION} environment variable, and this stack
# sets all the operational ones through stacks/budget/.env instead, so secrets
# never live in the repository.
#
# The file itself must exist: the image resolves its path from EBK_CONF_PATH and
# fails at startup with `open : no such file or directory` when it is missing.

[server]
# Overridden by EBK_SERVER_DOMAIN and EBK_SERVER_PROTOCOL.
protocol = https
domain = budget.munywele.co.ke
port = 8080

[log]
# "file" writes to /ezbookkeeping/log, "console" to stdout where the monitoring
# stack collects it. Overridden by EBK_LOG_MODE.
mode = file

[database]
# Overridden by EBK_DATABASE_* — this stack uses PostgreSQL, not sqlite3.
type = sqlite3

[object_storage]
type = local_filesystem
path = /ezbookkeeping/storage

[security]
# Overridden by EBK_SECURITY_SECRET_KEY. Generate with:
#   openssl rand -base64 32
# Never commit a real value.
secret_key = change_me
