services:
  budget:
    container_name: budget
    image: mayswind/ezbookkeeping:${EZBOOKKEEPING_TAG:-latest}
    hostname: budget
    restart: unless-stopped
    # The image runs as UID/GID 1000 and cannot write to a freshly created
    # named volume; see README for the chown alternative.
    user: "0:0"
    environment:
      # The image resolves its configuration path from this variable and fails at
      # startup with `open : no such file or directory` when it is empty, so the
      # file below must always be mounted.
      EBK_CONF_PATH: /ezbookkeeping/conf/ezbookkeeping.ini
      EBK_SERVER_DOMAIN: ${APP_DOMAIN:-budget.munywele.co.ke}
      EBK_SERVER_PROTOCOL: ${APP_PROTOCOL:-https}
      EBK_SERVER_ENABLE_GZIP: "true"
      EBK_DATABASE_TYPE: ${EBK_DATABASE_TYPE:-postgres}
      EBK_DATABASE_HOST: ${DB_HOST:-postgres}:${DB_PORT:-5432}
      EBK_DATABASE_NAME: ${DB_DATABASE:-ezbookkeeping}
      EBK_DATABASE_USER: ${DB_USERNAME:-ezbookkeeping}
      EBK_DATABASE_PASSWD: ${DB_PASSWORD:-}
      EBK_OBJECT_STORAGE_TYPE: ${EBK_OBJECT_STORAGE_TYPE:-local_filesystem}
      EBK_LOG_MODE: ${EBK_LOG_MODE:-file}
      EBK_SECURITY_SECRET_KEY: ${APP_KEY:-}
      TZ: ${TZ:-Africa/Nairobi}
      STACK_REVISION: ${STACK_REVISION:-1791743363}
    ports:
      - "127.0.0.1:9720:8080"
    volumes:
      # Relative bind-mount paths in an extended service file resolve against that
      # file's own directory, so the config file lives next to this one. Set
      # EZBOOKKEEPING_CONF to an absolute path if you deploy from another layout.
      - ${EZBOOKKEEPING_CONF:-./ezbookkeeping.ini}:/ezbookkeeping/conf/ezbookkeeping.ini:ro
      - ezbookkeeping_storage:/ezbookkeeping/storage
      - ezbookkeeping_logs:/ezbookkeeping/log
      - ezbookkeeping_data:/ezbookkeeping/data
    networks:
      - dokploy-network
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
          cpus: "0.1"