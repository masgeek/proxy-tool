services:
  budget:
    container_name: budget
    image: fireflyiii/core:${FIREFLY_TAG:-latest}
    hostname: budget
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:-}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://budget.munywele.co.ke}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-firefly}
      DB_USERNAME: ${DB_USERNAME:-firefly}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_HOST: ${REDIS_HOST:-cache}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-**}
      ALLOW_WEBHOOKS: ${ALLOW_WEBHOOKS:-true}
      TZ: ${TZ:-Africa/Nairobi}
      STACK_REVISION: ${STACK_REVISION:-1791743363}
    ports:
      - "127.0.0.1:9720:8080"
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    networks:
      - dokploy-network
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.1"