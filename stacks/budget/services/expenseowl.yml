services:
  budget:
    container_name: budget
    image: tanq16/expenseowl:${EXPENSEOWL_TAG:-main}
    hostname: budget
    restart: unless-stopped
    environment:
      STORAGE_TYPE: ${STORAGE_TYPE:-postgres}
      STORAGE_URL: ${STORAGE_URL:-postgres:5432/expenseowl}
      STORAGE_SSL: ${STORAGE_SSL:-disable}
      STORAGE_USER: ${DB_USERNAME:-expenseowl}
      STORAGE_PASS: ${DB_PASSWORD:-}
      TZ: ${TZ:-Africa/Nairobi}
      STACK_REVISION: ${STACK_REVISION:-1790584804}
    ports:
      - "127.0.0.1:9720:8080"
    volumes:
      - expenseowl_data:/app/data
    networks:
      - dokploy-network
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"