services:
  budget:
    container_name: budget
    image: actualbudget/actual-server:${ACTUAL_TAG:-latest}
    hostname: budget
    restart: unless-stopped
    environment:
      ACTUAL_PORT: "5006"
      ACTUAL_HTTPS: ${ACTUAL_HTTPS:-false}
      ACTUAL_URL: ${APP_URL:-https://budget.munywele.co.ke}
      ACTUAL_SERVER_FILES_DIR: /data/files
      DB_CONNECTION: ${DB_CONNECTION:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_DATABASE:-actual_budget}
      DB_USER: ${DB_USERNAME:-actual_budget}
      DB_PASSWORD: ${DB_PASSWORD:-}
      TZ: ${TZ:-Africa/Nairobi}
      STACK_REVISION: ${STACK_REVISION:-1791743363}
    ports:
      - "127.0.0.1:9720:5006"
    volumes:
      - actual_budget_files:/data/files
    networks:
      - dokploy-network
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.1"