name: "budget"

# Household budgeting stack — one application at a time on 127.0.0.1:9720,
# served publicly at budget.munywele.co.ke.
#
# The active app is chosen by the single `extends.file` value in
# services.budget. Only one may be referenced at a time; they all bind the
# same host port, so they can never run simultaneously.
#
#   services/yuvomi.yml         — family planner, SQLite (no external DB)
#   services/actual-budget.yml  — budgeting, PostgreSQL
#   services/firefly-iii.yml    — expense tracking, PostgreSQL + shared Redis
#   services/homebox.yml        — household inventory, PostgreSQL
#
# PostgreSQL apps reuse the shared `postgres` service; Firefly III also uses
# the shared `cache` Redis. Databases must exist before first start:
#   docker exec postgres createdb --username "$POSTGRES_USER" \
#     --owner "$POSTGRES_USER" actual_budget

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  budget_data:
    driver: local
    name: budget-data
  budget_backups:
    driver: local
    name: budget-backups
  budget_modules:
    driver: local
    name: budget-modules
  budget_documents:
    driver: local
    name: budget-documents
  actual_budget_files:
    driver: local
    name: actual-budget-files
  firefly_upload:
    driver: local
    name: firefly-upload
  homebox_data:
    driver: local
    name: homebox-data

services:
  budget:
    extends:
      file: ./services/yuvomi.yml
      service: budget