name: "budget"

# Household budgeting stack — one application at a time on 127.0.0.1:9720,
# served publicly at budget.munywele.co.ke.
#
# The active app is chosen by the single `extends.file` value in
# services.budget. Only one may be referenced at a time; they all bind the
# same host port, so they can never run simultaneously.
#
#   services/yuvomi.yml         — family planner, SQLite (no external DB)
#   services/firefly-iii.yml    — expense tracking, PostgreSQL + dedicated Redis (default)
#   services/actual-budget.yml  — budgeting, PostgreSQL
#   services/econumo.yml        — family budgeting, PostgreSQL (DATABASE_URL)
#   services/ezbookkeeping.yml  — bookkeeping, PostgreSQL (EBK_* env)
#
# PostgreSQL apps reuse the shared `postgres` service. Firefly III (the default
# app) uses this stack's dedicated Redis instead of the shared `cache` service.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  budget_data:
    driver: local
    name: budget-data
  budget_backups:
    driver: local
    name: budget-backups
  budget_modules:
    driver: local
    name: budget-modules
  budget_documents:
    driver: local
    name: budget-documents
  actual_budget_files:
    driver: local
    name: actual-budget-files
  firefly_upload:
    driver: local
    name: firefly-upload
  econumo_db:
    driver: local
    name: econumo-db
  econumo_jwt:
    driver: local
    name: econumo-jwt
  ezbookkeeping_storage:
    driver: local
    name: ezbookkeeping-storage
  ezbookkeeping_logs:
    driver: local
    name: ezbookkeeping-logs

services:
  budget:
    extends:
      file: ./services/firefly-iii.yml
      service: budget
