name: "monitoring"

# Observability stack: Grafana, Prometheus, and Alloy.
# Application logs are collected from Docker stdout and sent to the separate Loki stack.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  prometheus_data:
    driver: local
    name: prometheus-data
  grafana_data:
    driver: local
    name: grafana-data
  agent-data:
    driver: local
    name: agent-data

services:
  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - sleep 60 && exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_DATAPROXY_TIMEOUT: ${GRAFANA_DATAPROXY_TIMEOUT:-60}
      GF_DATAPROXY_MAX_CONNS_PER_HOST: ${GRAFANA_MAX_CONNS_PER_HOST:-20}
      GF_DATAPROXY_MAX_IDLE_CONNECTIONS: ${GRAFANA_MAX_IDLE_CONNECTIONS:-20}
    ports:
      - "127.0.0.1:9600:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/monitoring/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../../config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../../config/monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - type: bind
        source: ../../config/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ../../config/monitoring/prometheus/rules
        target: /etc/prometheus/rules
        read_only: true

    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_TAG:-v0.60.5}
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    privileged: true
    pid: host
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_TAG:-v1.9.1}
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    expose:
      - "9100"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_TAG:-v0.27.0}
    container_name: blackbox-exporter
    hostname: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ../../config/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_TAG:-v0.17.1}
    container_name: postgres-exporter
    hostname: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_URI:-postgres:5432/postgres?sslmode=disable}
      DATA_SOURCE_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      DATA_SOURCE_PASS: ${DB_PASSWORD:?DB_PASSWORD must be set}
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_TAG:-v1.86.0}
    container_name: redis-exporter
    hostname: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  agent:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    hostname: grafana-alloy
    restart: unless-stopped
    expose:
      - "12345"
    volumes:
      - ../../config/monitoring/agent:/etc/alloy:ro
      - agent-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint:
      - /bin/alloy
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: http://loki:3100
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"
