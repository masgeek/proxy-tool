name: "monitoring"

# Application logs remain on Loki through Alloy. Netdata handles host and
# container metrics independently without replacing the log pipeline.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  loki_data:
    driver: local
    name: loki-data
  agent-data:
    driver: local
    name: agent-data
  netdata-config:
    driver: local
    name: netdata-config
  netdata-lib:
    driver: local
    name: netdata-lib
  netdata-cache:
    driver: local
    name: netdata-cache

services:
  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    hostname: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ../../config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      LOKI_HTTP_PORT: ${LOKI_HTTP_PORT:-3100}
      LOKI_GRPC_PORT: ${LOKI_GRPC_PORT:-9096}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-info}
      LOKI_CACHE_MAX_SIZE_MB: ${LOKI_CACHE_MAX_SIZE_MB:-32}
      LOKI_REJECT_OLD_SAMPLES_AGE: ${LOKI_REJECT_OLD_SAMPLES_AGE:-48h}
      LOKI_MAX_ENTRIES_LIMIT: ${LOKI_MAX_ENTRIES_LIMIT:-1000}
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-48h}
      LOKI_MAX_QUERY_LOOKBACK: ${LOKI_MAX_QUERY_LOOKBACK:-48h}
      LOKI_MAX_QUERY_BYTES_READ: ${LOKI_MAX_QUERY_BYTES_READ:-128MB}
      LOKI_QUERY_TIMEOUT: ${LOKI_QUERY_TIMEOUT:-30s}
      LOKI_MAX_QUERY_PARALLELISM: ${LOKI_MAX_QUERY_PARALLELISM:-2}
      LOKI_TSDB_MAX_QUERY_PARALLELISM: ${LOKI_TSDB_MAX_QUERY_PARALLELISM:-4}
      LOKI_SPLIT_QUERIES_BY_INTERVAL: ${LOKI_SPLIT_QUERIES_BY_INTERVAL:-30m}
      LOKI_INGESTION_RATE_MB: ${LOKI_INGESTION_RATE_MB:-5}
      LOKI_INGESTION_BURST_SIZE_MB: ${LOKI_INGESTION_BURST_SIZE_MB:-10}
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.0"

  agent:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    hostname: grafana-alloy
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    expose:
      - "12345"
    volumes:
      - ../../config/monitoring/agent:/etc/alloy:ro
      - agent-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint:
      - /bin/alloy
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: http://loki:3100
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"

  netdata:
    image: netdata/netdata:${NETDATA_TAG:-latest}
    container_name: netdata
    hostname: netdata
    restart: unless-stopped
    pid: host
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - ../../config/monitoring/netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/host/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: ${NETDATA_MEMORY_LIMIT:-512m}
          cpus: "${NETDATA_CPU_LIMIT:-0.5}"
