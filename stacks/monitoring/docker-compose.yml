name: "monitoring"

# Metrics and log collection stack: Alloy and metric exporters.
# Grafana, Prometheus, and Loki run as separate stacks on the shared internal network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  agent-data:
    driver: local
    name: agent-data

services:
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_TAG:-v0.60.5}
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    privileged: true
    pid: host
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_TAG:-v1.9.1}
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    expose:
      - "9100"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_TAG:-v0.27.0}
    container_name: blackbox-exporter
    hostname: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ../../config/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_TAG:-v0.17.1}
    container_name: postgres-exporter
    hostname: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_URI:-postgres:5432/postgres?sslmode=disable}
      DATA_SOURCE_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      DATA_SOURCE_PASS: ${DB_PASSWORD:?DB_PASSWORD must be set}
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_TAG:-v1.86.0}
    container_name: redis-exporter
    hostname: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  agent:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    hostname: grafana-alloy
    restart: unless-stopped
    expose:
      - "12345"
    volumes:
      - ../../config/monitoring/agent:/etc/alloy:ro
      - agent-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint:
      - /bin/alloy
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: http://loki:3100
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"
