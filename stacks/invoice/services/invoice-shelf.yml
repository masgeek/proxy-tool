services:
  invoice:
    image: invoiceshelf/invoiceshelf:${INVOICESHELF_TAG:-latest}
    container_name: invoiceshelf
    hostname: invoiceshelf
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-InvoiceShelf}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://invoice.munywele.co.ke}
      SESSION_DOMAIN: ${APP_DOMAIN:-invoice.munywele.co.ke}
      SANCTUM_STATEFUL_DOMAINS: ${APP_URL:-https://invoice.munywele.co.ke}
      DB_CONNECTION: ${DB_CONNECTION:-mariadb}
      DB_HOST: ${DB_HOST:-maria}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-invoiceshelf}
      DB_USERNAME: ${DB_USERNAME:-invoiceshelf}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CACHE_STORE: ${CACHE_STORE:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-240}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      AUTORUN_ENABLED: ${AUTORUN_ENABLED:-true}
      AUTORUN_LARAVEL_MIGRATION: ${AUTORUN_LARAVEL_MIGRATION:-false}
      AUTORUN_LARAVEL_OPTIMIZE: ${AUTORUN_LARAVEL_OPTIMIZE:-false}
      PHP_OPCACHE_ENABLE: ${PHP_OPCACHE_ENABLE:-1}
      TZ: ${TZ:-Africa/Nairobi}
      STACK_REVISION: ${STACK_REVISION:-1790584804}
    ports:
      - "127.0.0.1:9705:8080"
    volumes:
      - invoiceshelf_storage:/var/www/html/storage/
      - invoiceshelf_modules:/var/www/html/Modules/
    networks:
      - dokploy-network
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"