name: "stats-api"

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  stats-api:
    container_name: stats-api
    hostname: stats-api
    image: ghcr.io/masgeek/mfl-dashboard:${STATS_API_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      GEOSERVER_BASE: ${GEOSERVER_BASE:-https://geo.akilimo.org/geoserver}
      STACK_REVISION: ${STACK_REVISION:-1790584804}
    ports:
      - "127.0.0.1:9511:5001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    networks:
      - dokploy-network
      - internal
