name: "loki-dashboard"

# Lightweight browser UI for the Loki API. It does not collect or store logs.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  dashboard:
    image: ghcr.io/romanzipp/loki-dashboard:${LOKI_DASHBOARD_TAG:-latest}
    container_name: loki-dashboard
    hostname: loki-dashboard
    restart: unless-stopped
    environment:
      LOKI_ENTRYPOINT: http://loki:3100
      COLORED_ROWS: "true"
    ports:
      - "127.0.0.1:9610:3000"
    networks:
      - dokploy-network
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: ${LOKI_DASHBOARD_MEMORY_LIMIT:-256m}
          cpus: "${LOKI_DASHBOARD_CPU_LIMIT:-0.25}"
