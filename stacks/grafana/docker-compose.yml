name: "grafana"

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  grafana_data:
    driver: local
    name: grafana-data

services:
  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - sleep 60 && exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_DATAPROXY_TIMEOUT: ${GRAFANA_DATAPROXY_TIMEOUT:-60}
      GF_DATAPROXY_MAX_CONNS_PER_HOST: ${GRAFANA_MAX_CONNS_PER_HOST:-20}
      GF_DATAPROXY_MAX_IDLE_CONNECTIONS: ${GRAFANA_MAX_IDLE_CONNECTIONS:-20}
    ports:
      - "127.0.0.1:9600:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/monitoring/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../../config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../../config/monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"
