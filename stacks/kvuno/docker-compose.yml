name: "kvuno"

# Application stack — deploy AFTER postgres database is running.
# Postgres is managed in the databases stack and reachable via
# the shared 'dokploy-network'.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  kvuno-data:
    driver: local
    name: kvuno-data

services:
  # One-shot, as root, before kvuno and worker start: give the kvuno-data
  # volume to the image's `app` user. Both containers run as that non-root
  # user, but the volume was created owned by root, so uploads failed with
  # "Permission denied: 'static/data/uploads'". Named, not numbered, so it
  # matches whatever uid the pulled image uses. Only wrong-owner entries are
  # touched; a failure is reported but never blocks the app.
  kvuno-data-init:
    container_name: kvuno-data-init
    image: ghcr.io/cgiar-agwise/kvuno-api:${KVUNO_TAG:-develop}
    pull_policy: always
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - "find /app/static/data \\( ! -user app -o ! -group app \\) -exec chown -h app:app {} + || echo 'kvuno-data-init: could not chown /app/static/data' >&2"
    restart: "no"
    volumes:
      - kvuno-data:/app/static/data

  kvuno:
    container_name: kvuno
    image: ghcr.io/cgiar-agwise/kvuno-api:${KVUNO_TAG:-develop}
    hostname: kvuno
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:9800:80"
    environment:
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      DEBUG_DB: ${DEBUG_DB:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # JSON log lines for aggregation (structlog; development = console output).
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DB_DRIVER: postgresql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_SCHEMA:?DB_SCHEMA must be set}
      SORT_JSON: ${SORT_JSON:-0}
      HOUSEKEEPING_ENABLED: ${HOUSEKEEPING_ENABLED:-true}
      # The UI is served same-origin through kvuno-web's proxy, so CORS is
      # only for other sites calling the API. `*` with credentials let any
      # origin make credentialed requests.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kvuno-ui.akilimo.org,https://kvuno-ui.agwise.org}
      # Account approval: anyone may register, but new accounts are pending
      # until an administrator approves them in the web app (Accounts).
      # ADMIN_EMAILS are the "owners" — always administrators, approved at
      # sign-up; they can make other approved accounts admins. Unset = nobody
      # can approve new accounts.
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS must be set (comma-separated administrator emails)}
      # Activation / rejection / new-registration emails. Optional: with
      # SMTP_HOST or MAIL_FROM unset nothing is sent and the API log shows
      # "email not sent: SMTP_HOST/MAIL_FROM unset" (logged with user ids, never addresses).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_APP_NAME: ${MAIL_APP_NAME:-KVuno}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      HOUSEKEEPING_MAX_WORKERS: ${HOUSEKEEPING_MAX_WORKERS:-1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis-jobs:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis-jobs:6379/1}
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-kvuno}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-10}
      CELERY_TASK_RETRY_DELAY: ${CELERY_TASK_RETRY_DELAY:-60}
      SERVER_URL_PROD: ${SERVER_URL_PROD:-}
      REMOTE_RDS_URLS: ${REMOTE_RDS_URLS:-}
      STACK_REVISION: ${STACK_REVISION:-1790584804}
      SPA_ROOT_URL: ${SPA_ROOT_URL:-https://kvuno-ui.akilimo.org}

    depends_on:
      kvuno-data-init:
        condition: service_completed_successfully
    volumes:
      - kvuno-data:/app/static/data
    networks:
      - dokploy-network
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

  web:
    container_name: kvuno-web
    hostname: kvuno-web
    image: ghcr.io/cgiar-agwise/kvuno-web:${KVUNO_TAG:-develop}
    restart: unless-stopped
    pull_policy: always
    environment:
      # Where the web container's nginx proxies /api, /ui, /api-docs and
      # /health: the `kvuno` API service above, over the shared network.
      # Older web images hardcoded `api:80`; on dokploy-network that name
      # belongs to another project, so kvuno-ui reached the wrong API.
      API_UPSTREAM: ${KVUNO_API_UPSTREAM:-http://kvuno:80}
    ports:
      - "127.0.0.1:9801:80"
    depends_on:
      kvuno:
        condition: service_started
    networks:
      - dokploy-network
      - internal
  worker:
    container_name: kvuno-worker
    # Time to stop cleanly. On SIGTERM the running ingest finishes its
    # current chunk, commits rows + offset and pauses; the restarted worker
    # resumes it. Docker's default 10 s killed it mid-file instead.
    stop_grace_period: 2m
    hostname: kvuno-worker
    image: ghcr.io/cgiar-agwise/kvuno-worker:${KVUNO_TAG:-develop}
    restart: unless-stopped
    pull_policy: always
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DEBUG_DB: ${DEBUG_DB:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # JSON log lines for aggregation (structlog; development = console output).
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_DRIVER: postgresql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_SCHEMA:?DB_SCHEMA must be set}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis-jobs:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis-jobs:6379/1}
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-kvuno}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-10}
      CELERY_TASK_RETRY_DELAY: ${CELERY_TASK_RETRY_DELAY:-60}
      HOUSEKEEPING_BATCH_SIZE: ${HOUSEKEEPING_BATCH_SIZE:-2000}
      HOUSEKEEPING_CHUNK_SIZE: ${HOUSEKEEPING_CHUNK_SIZE:-5000}
      HOUSEKEEPING_CHECKPOINT_INTERVAL: ${HOUSEKEEPING_CHECKPOINT_INTERVAL:-50}
      HOUSEKEEPING_MAX_WORKERS: ${HOUSEKEEPING_MAX_WORKERS:-1}
      REMOTE_RDS_URLS: ${REMOTE_RDS_URLS:-}
      HOUSEKEEPING_MODE: ${HOUSEKEEPING_MODE:-oneshot}
      RDS_COLUMN_MAP: ${RDS_COLUMN_MAP:-}
      STACK_REVISION: ${STACK_REVISION:-1790584804}
    depends_on:
      kvuno-data-init:
        condition: service_completed_successfully
    volumes:
      - kvuno-data:/app/static/data
    networks:
      - dokploy-network
      - internal
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"