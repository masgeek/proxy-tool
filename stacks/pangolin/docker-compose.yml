name: "pangolin"

networks:
  default:
    driver: bridge
    name: pangolin

volumes:
  pangolin_data:
    driver: local
    name: pangolin-data

services:
  pangolin:
    image: docker.io/fosrl/pangolin:latest
    container_name: pangolin
    hostname: pangolin
    restart: unless-stopped
    environment:
      SERVER_SECRET: ${SERVER_SECRET:?SERVER_SECRET must be set}
      STACK_REVISION: ${STACK_REVISION:-1790584804}
    volumes:
      - pangolin_data:/app/config
      - ./config/config.yml:/app/config/config.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: 10s
      timeout: 10s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  gerbil:
    image: docker.io/fosrl/gerbil:latest
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "${PANGOLIN_PUBLIC_IP:?PANGOLIN_PUBLIC_IP must be set}:51820:51820/udp"
      - "${PANGOLIN_PUBLIC_IP:?PANGOLIN_PUBLIC_IP must be set}:21820:21820/udp"
      - "${PANGOLIN_PUBLIC_IP:?PANGOLIN_PUBLIC_IP must be set}:443:443"
      - "${PANGOLIN_PUBLIC_IP:?PANGOLIN_PUBLIC_IP must be set}:80:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  traefik:
    image: docker.io/traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      - ./config/traefik/logs:/var/log/traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
