name: "activepieces"

# Activepieces workflow automation using the shared PostgreSQL and Redis services.
# Deploy after the databases and cache stacks.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  activepieces-cache:
    driver: local
    name: activepieces-cache

services:
  app:
    image: ghcr.io/activepieces/activepieces:${ACTIVEPIECES_TAG:-0.92.0}
    container_name: activepieces-app
    hostname: activepieces
    restart: unless-stopped
    pull_policy: always
    environment:
      AP_CONTAINER_TYPE: APP
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:?AP_FRONTEND_URL must be set}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?AP_ENCRYPTION_KEY must be set}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?AP_JWT_SECRET must be set}
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AP_REDIS_TYPE: STANDALONE
      AP_REDIS_HOST: cache
      AP_REDIS_PORT: 6379
      AP_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AP_QUEUE_UI_ENABLED: "false"
    ports:
      - "127.0.0.1:9710:80"
    volumes:
      - activepieces-cache:/usr/src/app/cache
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  worker:
    image: ghcr.io/activepieces/activepieces:${ACTIVEPIECES_TAG:-0.92.0}
    container_name: activepieces-worker
    restart: unless-stopped
    pull_policy: always
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://activepieces
      AP_WORKER_TOKEN: ${AP_WORKER_TOKEN:?AP_WORKER_TOKEN must be set}
      AP_WORKER_CONCURRENCY: 1
      AP_REUSE_SANDBOX: "true"
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
    volumes:
      - activepieces-cache:/usr/src/app/cache
    networks:
      - dokploy-network
      - internal
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
