name: "baserow"

# Operational database — Baserow, the grid UI over PostgreSQL.
#
#   baserow.munywele.co.ke -> 127.0.0.1:9730
#
# One container. The all-in-one baserow/baserow image bundles the API, the web
# frontend, the Celery workers, Redis and Caddy, which is enough for an internal
# tool and avoids the four extra services the split deployment needs.
#
# PostgreSQL still comes from the shared `databases` stack, so the data is covered
# by the existing db-backup tooling and readable with the tools already in place.
# Redis does not: Baserow runs its own inside this container, holding only its
# cache and locks. Nothing that matters lives there, so it needs no password, no
# index on a shared instance, and no entry in docs/redis-instances.md.
#
# The bundled Caddy is pinned to port 80 so the host Caddy keeps TLS for every
# domain in this repository and there is only one automatic ACME client.
#
# Create the database before first start:
#   docker exec postgres createdb --username "$POSTGRES_USER" \
#     --owner "$POSTGRES_USER" baserow
#
# Back up the `baserow-data` volume as well: it holds uploaded files and the
# application secrets generated on first start.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  baserow_data:
    driver: local
    name: baserow-data

services:
  baserow:
    image: baserow/baserow:${BASEROW_VERSION:-2.3.4}
    container_name: baserow
    hostname: baserow
    restart: unless-stopped
    environment:
      # Django signing key. Losing it logs everyone out and invalidates
      # outstanding password-reset links. Generate with: openssl rand -base64 48
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      # Public URL; must match the Caddy route or shared links are wrong.
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL:-https://baserow.munywele.co.ke}
      # Plain HTTP only: the host Caddy terminates TLS.
      CADDY_ADDRESS: ":80"
      DATABASE_HOST: ${DB_HOST:-postgres}
      DATABASE_PORT: ${DB_PORT:-5432}
      DATABASE_NAME: ${DB_DATABASE:-baserow}
      DATABASE_USER: ${DB_USERNAME:-baserow}
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # Applied only on the very first start, when the database is empty.
      BASEROW_INSTALL_JSON: ${BASEROW_INSTALL_JSON:-}
      # Uncomment to move uploaded files to Alarik in stacks/s3 instead of the
      # volume below. Switching does not migrate existing files.
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-baserow}
      # AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      # AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://s3:8080}
      TZ: ${TZ:-Africa/Nairobi}
      STACK_REVISION: ${STACK_REVISION:-1791743363}
    ports:
      - "127.0.0.1:9730:80"
    volumes:
      - baserow_data:/baserow/data
    networks:
      - dokploy-network
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.1"
